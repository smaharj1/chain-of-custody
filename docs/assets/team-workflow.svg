<svg viewBox="0 0 880 752" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="The handoff chain, interactive lane">
  <title>The Handoff Chain — Interactive Lane</title>
  <desc>The handoff chain for one feature as it runs when you drive it by hand. You describe a feature; /pm gathers requirements through questions and writes requirements.md; /architect brainstorms tradeoffs with you, writes technical-design.md and api-contract.md, and has design-critic audit them before any code exists; /tech-lead splits the design into per-engineer briefs, dispatches in dependency order, and code-reviews every diff; engineer subagents (database, backend, app, admin-app, infra) each start in a clean context, read only their brief plus the design and contract, self-verify, and report back to the Tech Lead for review and possible re-dispatch. A quick lane lets small fixes skip straight to /tech-lead. Every arrow between roles is a written artifact. Under /orchestrate the same four roles run this same chain autonomously: PM and Architect derive requirements from the plan item instead of asking you, no requirements.md is written, and review is an independent code-reviewer agent rather than the Tech Lead — so the human checkpoints move up to plan approval and the per-item auto-demo.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <style>
    .t{fill:#0f172a;font-size:13px;font-weight:600}
    .s{fill:#64748b;font-size:10px}
    .title{fill:#0f172a;font-size:16px;font-weight:700}
    .sub{fill:#64748b;font-size:11px}
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
    .hp{fill:#fff7ed;stroke:#d97706;stroke-width:2}
    .art{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3;stroke-dasharray:5 4}
    .doc{fill:#0f172a;font-size:11px;font-weight:600;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
    .edge{stroke:#64748b;stroke-width:1.5;fill:none}
    .edgea{stroke:#d97706;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
    .tie{stroke:#cbd5e1;stroke-width:1.2;fill:none;stroke-dasharray:3 3}
    .cap{fill:#d97706;font-size:10px;font-weight:600}
    .capm{fill:#64748b;font-size:10px}
  </style>

  <rect x="0.5" y="0.5" width="879" height="751" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="440" y="30" text-anchor="middle" class="title">The Handoff Chain — Interactive Lane</text>
  <text x="440" y="49" text-anchor="middle" class="sub">One feature, four hands. Nothing crosses a boundary except a written spec.</text>

  <!-- input -->
  <rect class="hp" x="240" y="70" width="240" height="32" rx="8"/>
  <text x="360" y="91" text-anchor="middle" class="t">You describe a feature</text>
  <line class="edge" x1="360" y1="102" x2="360" y2="126" marker-end="url(#ah)"/>

  <!-- PM -->
  <rect class="hp" x="200" y="128" width="320" height="76" rx="8"/>
  <text x="360" y="154" text-anchor="middle" class="t">/pm — Product Manager</text>
  <text x="360" y="172" text-anchor="middle" class="s">asks questions until scope is unambiguous</text>
  <text x="360" y="188" text-anchor="middle" class="s">decides nothing about how it gets built</text>

  <line class="edge" x1="360" y1="204" x2="360" y2="260" marker-end="url(#ah)"/>
  <line class="tie" x1="374" y1="234" x2="591" y2="234"/>
  <rect class="art" x="595" y="212" width="265" height="44" rx="6"/>
  <text x="727" y="232" text-anchor="middle" class="doc">requirements.md</text>
  <text x="727" y="247" text-anchor="middle" class="s">what and why — agreed with you</text>

  <!-- Architect -->
  <rect class="hp" x="200" y="262" width="320" height="96" rx="8"/>
  <text x="360" y="288" text-anchor="middle" class="t">/architect — Architect</text>
  <text x="360" y="306" text-anchor="middle" class="s">brainstorms tradeoffs with you, picks an approach</text>
  <text x="360" y="322" text-anchor="middle" class="s">writes the design, then freezes the interface</text>
  <text x="360" y="340" text-anchor="middle" class="cap">design-critic audits it before any code exists</text>

  <line class="edge" x1="360" y1="358" x2="360" y2="414" marker-end="url(#ah)"/>
  <line class="tie" x1="374" y1="387" x2="591" y2="387"/>
  <rect class="art" x="595" y="365" width="265" height="44" rx="6"/>
  <text x="727" y="385" text-anchor="middle" class="doc" font-size="10">technical-design.md · api-contract.md</text>
  <text x="727" y="400" text-anchor="middle" class="s">how it is built, and the exact interface</text>

  <!-- Tech Lead -->
  <rect class="box" x="200" y="416" width="320" height="96" rx="8"/>
  <text x="360" y="442" text-anchor="middle" class="t">/tech-lead — Tech Lead</text>
  <text x="360" y="460" text-anchor="middle" class="s">splits the design into per-engineer briefs</text>
  <text x="360" y="476" text-anchor="middle" class="s">dispatches in dependency order</text>
  <text x="360" y="492" text-anchor="middle" class="s">reviews every diff, re-dispatches on gaps</text>

  <line class="edge" x1="360" y1="512" x2="360" y2="568" marker-end="url(#ah)"/>
  <line class="tie" x1="374" y1="541" x2="591" y2="541"/>
  <rect class="art" x="595" y="519" width="265" height="44" rx="6"/>
  <text x="727" y="539" text-anchor="middle" class="doc">briefs/&lt;engineer&gt;.md</text>
  <text x="727" y="554" text-anchor="middle" class="s">one per engineer, scoped to its slice</text>

  <!-- Engineers -->
  <rect class="box" x="200" y="570" width="320" height="96" rx="8"/>
  <text x="360" y="596" text-anchor="middle" class="t">Engineers (subagents)</text>
  <text x="360" y="614" text-anchor="middle" class="s">database · backend · app · admin-app · infra</text>
  <text x="360" y="630" text-anchor="middle" class="s">each starts clean, reads only what it is handed</text>
  <text x="360" y="646" text-anchor="middle" class="s">self-verifies (lint, types, tests), reports back</text>

  <!-- return: report -> code review -->
  <path class="edge" d="M 200 618 H 162 V 492 H 196" marker-end="url(#ah)"/>
  <text x="152" y="556" text-anchor="end" class="capm" font-weight="600">structured report</text>
  <text x="152" y="569" text-anchor="end" class="capm">back to the Tech Lead,</text>
  <text x="152" y="582" text-anchor="end" class="capm">who code-reviews the diff</text>

  <!-- quick lane -->
  <path class="edgea" d="M 240 86 H 110 V 440 H 196" marker-end="url(#aha)"/>
  <text x="100" y="250" text-anchor="end" class="cap">quick lane</text>
  <text x="100" y="265" text-anchor="end" class="capm">bug fixes and</text>
  <text x="100" y="278" text-anchor="end" class="capm">small tweaks skip</text>
  <text x="100" y="291" text-anchor="end" class="capm">ahead — one</text>
  <text x="100" y="304" text-anchor="end" class="capm">engineer, no</text>
  <text x="100" y="317" text-anchor="end" class="capm">ceremony</text>

  <!-- what changes under /orchestrate -->
  <line class="tie" x1="40" y1="678" x2="840" y2="678"/>
  <text x="440" y="698" text-anchor="middle" class="sub">Under <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/orchestrate</tspan> the same four roles run this chain autonomously — the amber boxes go white, and your</text>
  <text x="440" y="713" text-anchor="middle" class="sub">checkpoints move up a level: approving the plan, then the auto-demo after each item.</text>

  <!-- legend -->
  <rect x="200" y="728" width="12" height="12" rx="3" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="220" y="738" class="capm">you are in the loop</text>
  <rect x="340" y="728" width="12" height="12" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="738" class="capm">agent works solo</text>
  <rect x="480" y="728" width="12" height="12" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="500" y="738" class="capm">the written handoff — the only thing that crosses</text>
</svg>
