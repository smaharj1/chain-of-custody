# verify: the untrusted PR job (report section 8.4, RC-3, DEC-39). Copy to .github/workflows/verify.yml.
#
# It runs the pull request's own code, so it holds nothing worth stealing: no secrets, no OIDC token,
# contents: read only, no deploy command. Make the job `verify` a REQUIRED status check in the ruleset
# (docs/security/rulesets.md), pinned to the GitHub Actions app.
#
# The verify definition is NOT taken from the pull request. The commands come from .claude/loop.config.md
# as committed at the base sha, and verify.py itself is fetched from the kit's own repository at the
# release this file pins (KIT_REF, checked against KIT_SHA), so a change set cannot weaken its own gate
# (CO-11). The first pull request that adds loop.config therefore cannot pass this job; a human merges
# that one, then this job protects every later one.
#
# Network egress is the one control a workflow file cannot give you. On GitHub-hosted runners the job can
# reach any host; use a self-hosted runner or an egress-filtering step if package registries only is a
# requirement (docs/security/split-ci.md).
#
# Actions are referenced by tag; pin each to a commit SHA before you rely on this (ci_lint warns).
name: verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4 # pin to a commit SHA
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the kit at its pinned release (never from the pull request)
        env:
          KIT_REPO: https://github.com/smaharj1/chain-of-custody.git
          KIT_REF: "{{KIT_REF}}"
          KIT_SHA: "{{KIT_SHA}}"
        run: |
          set -eu
          case "$KIT_SHA" in
            *[!0-9a-f]*|"") echo "::error::KIT_SHA is not a commit. Copy this file with the bootstrap setup script, which pins the kit release."; exit 1 ;;
          esac
          git init -q "$RUNNER_TEMP/kit"
          git -C "$RUNNER_TEMP/kit" fetch -q --depth 1 --no-tags "$KIT_REPO" "refs/tags/$KIT_REF"
          git -C "$RUNNER_TEMP/kit" -c advice.detachedHead=false checkout -q FETCH_HEAD
          got="$(git -C "$RUNNER_TEMP/kit" rev-parse HEAD)"
          if [ "$got" != "$KIT_SHA" ]; then
            echo "::error::The kit tag $KIT_REF is at $got, not the pinned $KIT_SHA. A moved tag is not run: check the release, then pin it again."
            exit 1
          fi

      # TOOLCHAIN (project-specific; pick yours and pin it to the same versions as .tool-versions / .nvmrc):
      # - uses: actions/setup-node@v4 # pin to a commit SHA
      #   with:
      #     node-version-file: .nvmrc
      # - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify (G6, definition read from the base sha)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA:.claude/loop.config.md" 2>/dev/null; then
            echo "::error::The base branch has no .claude/loop.config.md. A human merges the PR that adds it; verify protects the PRs after it."
            exit 1
          fi
          set +e
          python3 "$RUNNER_TEMP/kit/scripts/verify.py" --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" \
            --apply-gate --no-log --json > "$RUNNER_TEMP/verify.json"
          rc=$?
          python3 - "$RUNNER_TEMP/verify.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          try:
              r = json.load(open(sys.argv[1]))
          except (OSError, ValueError):
              print("verify produced no result")
              sys.exit(0)
          print("### verify: %s" % r.get("status", "?").upper())
          print(r.get("message", ""))
          print("")
          print("| stage | status | detail |")
          print("|---|---|---|")
          for s in r.get("stages", []):
              print("| %s | %s | %s |" % (s["name"], s["status"], (s.get("reason") or "").replace("|", "/")[:120]))
          for f in r.get("findings", []):
              print("- %s: %s" % (f["id"], f["message"]))
          PY
          cat "$RUNNER_TEMP/verify.json"
          exit "$rc"
